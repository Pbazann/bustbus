<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="BustBus: el juego del autobús para la previa. Juega en un solo móvil o cada uno con el suyo con un código de partida.">
<meta name="theme-color" content="#0f1830">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BustBus">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>BustBus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: app de una sola pantalla sin scroll. Cabecera fina, zona de juego que se adapta al alto disponible (container queries), botón grande de "Siguiente" abajo. Nombres y paradas en forma de billete. */
:root{
  --night:#0f1830; --seat:#1a2850; --panel:rgba(8,13,30,.72); --line:rgba(255,255,255,.13);
  --bus:#ffc21a; --bus-deep:#c98e00; --stop:#e8322b; --stop-soft:#ff6a5c; --teal:#2ec4b6;
  --ink:#f5f2ff; --muted:#a9b2d8; --ticket:#f3e9cf; --ticket-ink:#2b2236; --ticket-edge:#b9ab86;
  --f-display:'Bungee','Arial Black',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,sans-serif;
  --f-cond:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.35;-webkit-tap-highlight-color:transparent;
  background:var(--night) linear-gradient(170deg,#1d2c5a 0%,#121d3d 50%,#0b1228 100%) fixed}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input{outline:none;-webkit-appearance:none;appearance:none}
input:focus,input:focus-visible{outline:none;box-shadow:none}
input[type=checkbox]{-webkit-appearance:auto;appearance:auto}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

header.top{display:flex;gap:10px;align-items:center;padding-block:8px 4px;flex:none}
.hd{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.12}
.hd .brand{font-family:var(--f-display);font-size:18px;color:var(--bus)}
.hd .phase{font-family:var(--f-cond);font-weight:600;font-size:14.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{flex:none;width:44px;height:44px;border-radius:13px;border:2px solid #2b3555;background:var(--seat);display:grid;place-content:center;gap:5px}
.burger span{display:block;width:20px;height:3px;border-radius:2px;background:var(--ink)}

main{flex:1;min-height:0;overflow:hidden;container-type:size;padding-block:4px}
.scr{height:100%;display:flex;flex-direction:column;min-height:0}
footer.bottom{flex:none;padding-block:6px 10px;display:flex;flex-direction:column;gap:8px}
.next{width:100%;border:0;border-radius:15px;padding:15px 14px;font-family:var(--f-display);font-size:18px;letter-spacing:.4px;background:var(--bus);color:#1c1503;box-shadow:0 5px 0 var(--bus-deep),0 10px 22px rgba(0,0,0,.4);transition:transform .08s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--bus-deep)}
.next:disabled{background:#384063;color:#a2a9c6;box-shadow:0 5px 0 #262c48;cursor:default;font-size:16px}
.secondary{border:2px solid var(--line);background:var(--seat);border-radius:14px;padding:13px;font-weight:700;width:100%;font-size:16px}
.linkbtn{border:0;background:none;color:var(--muted);font-weight:600;padding:4px 0;text-align:left;align-self:flex-start}

/* ---------- Cartas ---------- */
.card{--w:70px;width:var(--w);aspect-ratio:338/489;position:relative;perspective:900px;flex:none}
.card.es{aspect-ratio:66.24/102.08}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.card.up .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face img{display:block;width:100%;height:100%;object-fit:fill;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));-webkit-user-select:none;user-select:none;pointer-events:none}
.front{transform:rotateY(180deg)}
.cimg{display:block;width:100%;height:100%;background-repeat:no-repeat;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.placeholder{width:var(--w);aspect-ratio:338/489;border:2px dashed rgba(245,242,255,.22);border-radius:8%/6%;flex:none}
.land{animation:land .4s .6s both}
@keyframes land{from{transform:translateY(-14px);opacity:0}}

/* ---------- Billetes ---------- */
.ticket{position:relative;display:flex;align-items:center;background:var(--ticket);color:var(--ticket-ink);border-radius:10px;box-shadow:0 3px 0 var(--ticket-edge)}
.ticket.notch::before,.ticket.notch::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#131e3f}
.ticket.notch::before{left:-7px}.ticket.notch::after{right:-7px}
.stub{flex:none;align-self:stretch;display:grid;place-content:center;text-align:center;padding:0 10px;border-right:2px dashed rgba(43,34,54,.35);font-family:var(--f-cond);font-weight:700;font-size:12px;letter-spacing:1px;line-height:1.05;text-transform:uppercase;opacity:.75}
.ticket input{flex:1;min-width:0;border:0;background:transparent;font:600 17px var(--f-body);color:var(--ticket-ink);padding:11px 10px}
.ticket input::placeholder{color:rgba(43,34,54,.42)}
.ticket .rm{flex:none;width:34px;border:0;background:transparent;font-size:17px;color:rgba(43,34,54,.55);align-self:stretch}

/* ---------- Inicio y formularios ---------- */
.home{justify-content:center;gap:clamp(8px,2.2cqh,18px);text-align:center}
.hero-bus{width:min(280px,80%,46cqh);height:auto;display:block;margin:0 auto}
.bob{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1.title{margin:0;line-height:0}
.logo{width:min(320px,84cqw,56cqh);max-width:100%;height:auto;filter:drop-shadow(0 0 1px rgba(255,236,180,.5)) drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.hd .brand img{display:block;height:17px;width:auto;margin:1px 0 2px;filter:drop-shadow(0 0 1px rgba(255,236,180,.5))}
.tagline{margin:-4px 0 0;color:var(--muted);font-size:clamp(15px,4.4cqw,18px);font-weight:600}
.menu-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px;margin:0 auto}
.resume{border:2px solid var(--teal);background:rgba(46,196,182,.12);border-radius:14px;padding:12px;font-weight:700;color:var(--teal)}
.credits{color:var(--muted);font-size:11px;opacity:.6;margin:0 8px}
.form{gap:clamp(8px,2cqh,16px)}
.form h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,7cqw,28px);margin:0;color:var(--bus)}
.lbl{font-family:var(--f-cond);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-size:13.5px;margin:0 0 6px}
.decks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deck-opt{border:3px solid var(--line);border-radius:14px;background:var(--panel);padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.deck-opt[aria-pressed="true"]{border-color:var(--bus);box-shadow:0 0 0 3px rgba(255,194,26,.16)}
.deck-opt .fan{display:flex;justify-content:center}
.deck-opt .fan .card{--w:min(54px,9cqh)}
.deck-opt .fan .card:first-child{transform:rotate(-8deg) translateX(7px)}
.deck-opt .fan .card:last-child{transform:rotate(8deg) translate(-7px,2px)}
.deck-opt b{font-family:var(--f-display);font-weight:400;font-size:14px}
.deck-opt small{color:var(--muted);font-size:12px;line-height:1.15}
.codebox{width:100%;text-align:center;font-family:var(--f-display);font-size:34px;letter-spacing:10px;text-transform:uppercase;padding:10px 0 10px 10px;border:0;border-radius:12px;background:var(--ticket);color:var(--ticket-ink);box-shadow:0 3px 0 var(--ticket-edge)}
.names{display:flex;flex-direction:column;gap:7px;width:min(100%,300px);min-height:0;overflow-y:auto;padding:2px 8px 6px}
.local-setup{gap:clamp(6px,1.6cqh,12px)}
.local-setup .names{flex:1;align-self:center}
.nrow{flex:none;min-width:0}
.names .ticket input{font-size:15.5px;padding:8px 8px}
.names .stub{padding:0 9px;font-size:13px;min-width:34px}
.addp{flex:none;border:2px dashed rgba(245,242,255,.3);background:transparent;border-radius:10px;font-weight:600;min-height:40px}
.hint{color:var(--muted);font-size:14.5px;margin:0}

/* ---------- Lobby ---------- */
.lobby{align-items:center;text-align:center;gap:clamp(8px,2cqh,16px)}
.bigcode{flex-direction:column;padding:10px 30px 12px;transform:rotate(-2deg)}
.bigcode small{font-family:var(--f-cond);font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;opacity:.7}
.bigcode b{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,12cqw,56px);letter-spacing:8px;line-height:1.05}
.plist{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;overflow:hidden}
.pchip{padding:9px 10px;font-weight:700;font-size:15.5px;min-width:0;justify-content:space-between;gap:6px}
.pchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip em{font-style:normal;font-family:var(--f-cond);font-size:12px;letter-spacing:.8px;text-transform:uppercase;opacity:.65;flex:none}
.pchip.me{background:#ffd85c;box-shadow:0 3px 0 #c99a12}

/* ---------- Comunes de juego ---------- */
.eyebrow{font-family:var(--f-cond);font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-size:13.5px;margin:0}
.turnline{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.tk-name{max-width:100%;padding:6px 18px 6px 0;transform:rotate(-1.5deg)}
.tk-name b{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,min(7cqw,5.2cqh),30px);padding-left:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.q{font-family:var(--f-display);font-size:clamp(17px,min(5.5cqw,4cqh),22px);color:var(--bus)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.choice{border:2px solid var(--line);border-radius:15px;background:var(--seat);padding:clamp(12px,3cqh,20px) 6px;font-family:var(--f-display);font-size:clamp(16px,5cqw,20px);box-shadow:0 4px 0 #0b1226;transition:transform .08s;position:relative}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1226}
.choice[aria-pressed="true"]{border-color:var(--bus);background:#3a3410}
.choice .vc{position:absolute;top:-8px;right:-6px;background:var(--bus);color:#1c1503;font:700 13px var(--f-cond);border-radius:10px;padding:1px 7px}
.stamp{display:inline-block;font-family:var(--f-display);font-size:clamp(18px,6cqw,24px);padding:6px 16px;border:4px solid currentColor;border-radius:12px;transform:rotate(-5deg);animation:stamp .35s .55s both}
.stamp.bad{color:var(--stop-soft);background:rgba(232,50,43,.14)}
.stamp.good{color:var(--teal);background:rgba(46,196,182,.12)}
.stamp.win{color:var(--bus);background:rgba(255,194,26,.12)}
@keyframes stamp{from{opacity:0;transform:rotate(-5deg) scale(1.9)}to{opacity:1;transform:rotate(-5deg) scale(1)}}
.explain{margin:8px 0 0;font-size:15px;animation:fade .3s .6s both}
@keyframes fade{from{opacity:0}}
.wait{color:var(--muted);font-weight:600;text-align:center;margin:0}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- Parada 1 ---------- */
.p1{justify-content:space-evenly;align-items:center;text-align:center}
.hand-big{display:flex;justify-content:center;gap:2.5cqw}
.hand-big .card,.hand-big .placeholder{--w:min(21cqw,20cqh)}
.hand-big .card.new{animation:deal .4s ease-out both}
@keyframes deal{from{transform:translateY(-30px) rotate(-6deg);opacity:0}}
.p1 .result{min-height:min(20cqh,110px);display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}

/* ---------- Parada 2 ---------- */
.p2{gap:1.5cqh}
.pyr{--pw:min(21cqw,11.2cqh);flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.p2.local .pyr{--pw:min(17cqw,7cqh)}
.pyr-row{--w:var(--pw);display:flex;gap:1.6cqw;position:relative}
.pyr-row+.pyr-row{margin-top:calc(var(--pw) * -.33)}
.pyr .card{--w:var(--pw)}
.pc{position:relative}
.pc.cur .card{outline:3px solid var(--bus);outline-offset:2px;border-radius:8%/6%}
.pc .bdg{position:absolute;top:30%;right:-6px;background:var(--stop);color:#fff;font:700 13px var(--f-cond);border-radius:9px;padding:1px 6px;box-shadow:0 0 0 2px var(--night);z-index:3}
.p2info{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;text-align:center}
.p2info .big{font-family:var(--f-display);font-size:16px;color:var(--bus)}
.p2info .sm{color:var(--muted);font-size:13.5px;line-height:1.25}
.p2info .log{font-size:13.5px;margin-top:2px}
.myhand{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.myhand .cs{display:flex;gap:2.5cqw;justify-content:center;min-height:calc(min(19cqw,15cqh) * 1.45)}
.myhand .card{--w:min(19cqw,15cqh)}
.cs button{border:0;padding:0;background:none}
.cs button.match .card{outline:3px solid var(--teal);outline-offset:2px;border-radius:8%/6%;animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{outline-color:rgba(46,196,182,.35)}}
.hgrid{--hw:min(9.5cqw,calc((50cqh - var(--rows) * 30px) / (var(--rows) * 1.5)));flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.htile{flex-direction:column;align-items:stretch;padding:4px 6px 6px;gap:3px;min-width:0}
.htile .nm{display:flex;justify-content:space-between;gap:4px;font-weight:700;font-size:13.5px;border-bottom:2px dashed rgba(43,34,54,.25);padding-bottom:2px}
.htile .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htile .nm em{font-style:normal;opacity:.6;flex:none}
.htile .cs{display:flex;gap:4px;min-height:calc(var(--hw) * 1.45)}
.htile .card{--w:var(--hw)}
.empty{font-size:13px;opacity:.55;align-self:center;font-weight:600}

/* ---------- Parada 3 ---------- */
.p3{gap:1cqh}
.riders{flex:none;text-align:center;font-size:14px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.riders b{color:var(--bus)}
.bus{--w:min(22cqw,10.8cqh);flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto 1fr;grid-template-areas:"top top top" "l m r";gap:1cqh 2.5cqw;align-content:center}
.bus .card{--w:inherit}
.bridge{grid-area:top;justify-self:center;position:relative}
.col{display:flex;flex-direction:column;gap:1cqh;justify-content:center}
.col.l{grid-area:l}.col.r{grid-area:r}
.slot{position:relative;width:var(--w)}
.slot .tg{position:absolute;top:-7px;right:-7px;min-width:21px;height:21px;padding:0 4px;border-radius:11px;background:#0b1024;border:1.5px solid rgba(169,178,216,.6);font:700 12px var(--f-cond);display:grid;place-items:center;z-index:2}
.slot.done .tg{border-color:var(--teal);color:var(--teal)}
.slot.cur .card{outline:3px solid var(--bus);outline-offset:3px;border-radius:8%/6%;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{outline-color:rgba(255,194,26,.35)}}
.cpflag{position:absolute;left:100%;top:50%;transform:translate(12px,-50%);font:700 11px var(--f-cond);letter-spacing:1px;white-space:nowrap;padding:1px 6px;border-radius:5px;border:1.5px dashed rgba(169,178,216,.6);color:var(--muted)}
.cpflag.on{border-style:solid;border-color:var(--teal);color:#06231f;background:var(--teal)}
.mid{--bw:var(--w);grid-area:m;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqh;text-align:center}
.pile{display:flex;gap:8px;align-items:flex-end}
.pile .card,.pile .placeholder{--w:calc(var(--bw) * .95)}
.deckstack{position:relative}
.deckstack .cnt{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font:700 12px var(--f-cond);background:#0b1024;border:1px solid var(--line);border-radius:8px;padding:0 6px;white-space:nowrap}
.mid .ask{font-size:14px;line-height:1.25}
.mid .ask b{display:block;font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--bus)}
.mid .choices{grid-template-columns:1fr;gap:8px}
.mid .choice{padding:10px 6px;font-size:16px}
.mid .stamp{font-size:16px;padding:5px 10px;border-width:3px}
.mid .explain{font-size:13.5px;margin-top:4px}
.banner{position:fixed;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none;animation:bannerOut 3s ease forwards}
.banner .ticket{flex-direction:column;padding:16px 26px;transform:rotate(-3deg);text-align:center;max-width:86vw}
.banner small{font-family:var(--f-cond);font-weight:700;letter-spacing:1.4px;text-transform:uppercase;opacity:.7}
.banner b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.15;word-break:break-word}
@keyframes bannerOut{0%{opacity:0;transform:scale(.9)}10%,80%{opacity:1;transform:none}100%{opacity:0}}


/* ---------- Un solo móvil ---------- */
.p1.loc .who{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,min(9cqw,6.5cqh),40px);line-height:1.05;margin:0;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bigdeck .card{--w:min(40cqw,24cqh)}
.prev{display:flex;gap:2cqw;justify-content:center;min-height:calc(min(14cqw,9cqh) * 1.45);align-items:center}
.prev .card{--w:min(14cqw,9cqh)}
.empty-l{color:var(--muted);font-size:13.5px;font-weight:600}
.pbtn{border:0;padding:0;background:none;display:block;border-radius:8%/6%}
.pbtn:active{transform:scale(.96)}
.p2.local .pyr{--pw:min(22cqw,13.5cqh)}
.ann{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.ann span{font-family:var(--f-display);font-size:clamp(15px,4.6cqw,19px);color:var(--stop-soft);animation:stamp .35s .55s both}
.counts{flex:none;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cchip{padding:4px 9px;gap:6px;font-size:13.5px}
.cchip b{max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cchip em{font-style:normal;font-family:var(--f-display);font-size:13px}
.bigdraw .card{--w:min(34cqw,calc(var(--bw) * 1.5))}
.arrows{display:flex;gap:12px}
.arrow{width:min(68px,17cqw);height:min(68px,17cqw);border-radius:50%;border:3px solid var(--bus);background:var(--seat);color:var(--bus);font-size:clamp(24px,7cqw,32px);line-height:1;box-shadow:0 4px 0 #0b1226}
.arrow:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1226;background:#3a3410}
.p3.loc .ask{font-size:13.5px;color:var(--muted);max-width:22ch}
.pop{position:fixed;inset:0;z-index:18;display:grid;place-items:center;background:rgba(3,6,16,.6);animation:fade .25s .7s both;padding:0 24px}

 r3t:"Arrêt 3 · Le trajet", r3:["9 cartes en forme de ∩ : deux rangées de 4 et un pont en haut.","Devine si la carte sera plus haute ou plus basse. Égalité = raté.","Si tu rates, tu bois autant de gorgées que de cartes atteintes (y compris la ratée) et tu recommences.","Si tu passes le pont, c'est un checkpoint : tu y retournes, mais les gorgées comptent quand même.","Si vous êtes plusieurs, chacun vote, la majorité l'emporte et on appuie sur Suivant pour confirmer.","Sur un seul téléphone : une carte sort de la pioche et tu devines si la suivante du parcours sera plus haute (▲) ou plus basse (▼)."],

    const pi = L ? a.p : who; const pl = st.pl[pi]; if(!pl) return false;
    const c = pl.h[a.c]; if(!c || val(c) !== val(P.py[P.rev])) return false;
    pl.h.splice(a.c, 1); P.piles[P.rev]++; H.thrown.push(c); P.pend = {f:pi, c, ci:a.c};
    ev({}); return true;
  }
  if(a.t === 'target'){
    const P = st.p2; if(st.ph !== 'p2' || !P.pend || !ok(who === P.pend.f)) return false;
    const to = a.to; if(!st.pl[to] || to === P.pend.f) return false;
    const n = ROW_DRINKS[rowOf(P.rev)]; st.pl[to].d += n;
    P.log.push([P.rev, P.pend.f, to, n]); if(P.log.length > 8) P.log.shift();
    P.pend = null; ev({snd:'bad'}); return true;
  }
  if(a.t === 'undo'){
    const P = st.p2; if(st.ph !== 'p2' || !P.pend || !ok(who === P.pend.f)) return false;
    const pd = P.pend; P.piles[P.rev]--; const k = H.thrown.lastIndexOf(pd.c); if(k >= 0) H.thrown.splice(k, 1);
    st.pl[pd.f].h.splice(pd.ci, 0, pd.c); P.pend = null; ev({}); return true;
  }
  if(a.t === 'vote'){
    const P = st.p3; if(st.ph !== 'p3' || P.s !== 'g' || !['mayor','menor'].includes(a.v)) return false;
    if(!ok(P.rid.includes(who))) return false;
    if(P.loc){ p3LocGuess(a.v); return true; }
    if(L || P.rid.length === 1){ p3Resolve(a.v); return true; }
    const id = st.pl[who].id;
    if(P.vo[id] === a.v) return false;
    P.vo[id] = a.v;
    ev({}); return true;
  }
  if(a.t === 'next'){
    if(st.ph === 'p1'){
      const P = st.p1; if(!P.done || !ok(who === P.pi || isHost)) return false;
      const n = st.pl.length;
      if(P.r === 3 && P.pi === n-1){ p2Init(); return true; }
      P.pi = (P.pi + 1) % n; if(P.pi === 0) P.r++; P.done = 0; P.ok = 0; P.why = null;
      ev({}); return true;
    }
    if(st.ph === 'p2'){
      const P = st.p2; if(P.pend || !isHost) return false;
      if(P.cnt < 10){ if(L) return false; const i = P.cnt; P.rv[i] = 1; P.rev = i; P.cnt++; ev({flip:P.py[i]}); return true; }
      p3Init(); return true;
    }
    if(st.ph === 'p3'){
      const P = st.p3, rider = P.rid.includes(who);
      if(P.loc){ if(P.s === 'r' || P.s === 'f'){ p3LocNext(); return true; } if(P.s === 'w'){ st.ph = 'end'; ev({snd:'win'}); return true; } return false; }
      if(P.s === 'g'){ const m = majority(P); if(!m || !ok(rider)) return false; p3Resolve(m); return true; }
      if(P.s === 'r'){ if(!ok(rider || isHost)) return false;
        P.s = 'g'; P.vo = {}; let f = null; if(!P.rv[P.pos]){ P.rv[P.pos] = 1; f = P.sl[P.pos]; }
        ev(f ? {flip:f} : {}); return true; }
      if(P.s === 'w'){ if(!ok(rider || isHost)) return false; st.ph = 'end'; ev({snd:'win'}); return true; }
    }
    if(st.ph === 'end'){ if(!isHost) return false; startGame(); return true; }
  }
  return false;
}

let roomApi = null, roomPromise = null, unsubPeers = null;
function getRoom(){
  if(!roomPromise) roomPromise = (async () => {
    try{ roomApi = window.claude && window.claude.use ? await Promise.race([window.claude.use('room'), new Promise(r => setTimeout(() => r(null), 4000))]) : null; }catch(e){ roomApi = null; }
    return roomApi;
  })();
  return roomPromise;
}
function genCode(){ let s = ''; for(let i=0;i<4;i++) s += rnd(10); return s; }
const BAD_CH = new RegExp('[\\u0000-\\u001f\\u007f\\u200b-\\u200f\\u2028-\\u202e\\u2060-\\u206f\\ufeff]', 'g');
const cleanName = s => String(s || '').replace(BAD_CH, '').trim().slice(0, 14);
/* Sin Claude (web publicada): misma interfaz que room, sobre un broker MQTT público.
   Cada móvil guarda su "presencia" como mensaje retenido en bustbus/v1/<código>/<id>. */
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
const MAX_AGE = 12 * 3600 * 1000;
function connectBroker(url, will){
  return new Promise((resolve, reject) => {
    let done = false;
    const cl = window.mqtt.connect(url, {clientId:'bb_' + ME + '_' + Math.random().toString(36).slice(2,7), clean:true, keepalive:30, reconnectPeriod:2500, connectTimeout:7000, will});
    const fail = e => { if(done) return; done = true; try{ cl.end(true); }catch(_){} reject(e || new Error('timeout')); };
    const t = setTimeout(() => fail(new Error('timeout')), 8000);
    cl.once('connect', () => { if(done) return; done = true; clearTimeout(t); resolve(cl); });
    cl.once('error', fail);
  });
}
async function mqttRoom(c){
  if(!window.mqtt) throw new Error('nomqtt');
  const base = 'bustbus/v1/' + c.toLowerCase() + '/', myTopic = base + ME;
  const will = {topic: myTopic, payload: '', qos: 1, retain: true};
  let client = null;
  for(const url of BROKERS){ try{ client = await connectBroker(url, will); break; }catch(e){} }
  if(!client) throw new Error('nobroker');
  const peers = new Map(); let mine = {}, handlers = [], nT = null, pT = null, closed = false;
  const list = () => [{peer:ME, isMe:true, presence:mine}].concat([...peers].map(([pid, pr]) => ({peer:pid, isMe:false, presence:pr})));
  const notify = () => { if(nT) return; nT = setTimeout(() => { nT = null; const ps = list(); handlers.forEach(h => { try{ h({peers:ps, joined:[], left:[], updated:[]}); }catch(e){ console.error(e); } }); }, 30); };
  const pub = () => { if(pT) return; pT = setTimeout(() => { pT = null; if(!closed) client.publish(myTopic, JSON.stringify({p:mine, t:Date.now()}), {qos:1, retain:true}); }, 60); };
  client.on('message', (topic, payload) => {
    if(!topic.startsWith(base)) return;
    const pid = topic.slice(base.length); if(pid === ME) return;
    const txt = payload ? payload.toString() : '';
    if(!txt){ if(peers.delete(pid)) notify(); return; }
    try{ const m = JSON.parse(txt); if(!m || typeof m.p !== 'object' || Math.abs(Date.now() - (+m.t || 0)) > MAX_AGE) return; peers.set(pid, m.p); notify(); }catch(e){}
  });
  client.on('connect', () => { client.subscribe(base + '+', {qos:1}); if(Object.keys(mine).length) pub(); });
  client.subscribe(base + '+', {qos:1});
  return {
    presence(patch){ const m = Object.assign({}, mine); for(const k in patch){ if(patch[k] === null) delete m[k]; else m[k] = patch[k]; } mine = m; pub(); notify(); return Promise.resolve(); },
    onPeers(fn){ handlers.push(fn); notify(); return () => { handlers = handlers.filter(h => h !== fn); }; },
    peers: list,
    leave(){ closed = true; return new Promise(res => { try{ client.publish(myTopic, '', {qos:1, retain:true}, () => { client.end(false, {}, res); }); }catch(e){ res(); } setTimeout(res, 1500); }); }
  };
}
async function joinRoom(c){
  const room = await getRoom();
  if(room) return room.join('bus-' + c.toLowerCase());
  return mqttRoom(c);
}
function sendPresence(){
  if(!R) return;
  const base = mode === 'host' ? {role:'host', code, pid:ME, st} : {role:'p', code, pid:ME, nm:cleanName(ui.name), aq:myQ};
  R.presence(Object.assign({av: validAv(profile.av) ? profile.av : null}, base)).catch(e => {
    if(e && e.code === 'invalid_argument') R.presence(Object.assign({av:null}, base)).catch(() => toast(t('errSync')));
  });
}
function uniqueName(nm){ let n = nm, k = 2; while(st.pl.some(p => p.n.toLowerCase() === n.toLowerCase())) n = nm.slice(0,12) + ' ' + (k++); return n; }
function onPeers(ch){
  const peers = ch.peers;
  let avChanged = false;
  peers.forEach(p => { const pr = p.presence || {}; if(pr.code === code && typeof pr.pid === 'string' && pr.pid !== ME){ const a = validAv(pr.av) ? pr.av : null; if(AV[pr.pid] !== a){ AV[pr.pid] = a; avChanged = true; } } });
  if(mode === 'host'){
    let changed = false;
    if(st.ph === 'lobby'){
      const here = new Set([ME]);
      peers.forEach(p => {
        const pr = p.presence || {}; if(pr.role !== 'p' || pr.code !== code || typeof pr.pid !== 'string') return;
        const nm = cleanName(pr.nm); if(!nm) return;
        here.add(pr.pid);
        if(idxOf(pr.pid) < 0 && st.pl.length < MAXP(st.dk)){ st.pl.push({id:pr.pid, n:uniqueName(nm), h:[], d:0}); changed = true; }
      });
      const before = st.pl.length; st.pl = st.pl.filter(p => here.has(p.id)); if(st.pl.length !== before) changed = true;
    }
    peers.forEach(p => {
      const pr = p.presence || {}; if(pr.role !== 'p' || pr.code !== code || !Array.isArray(pr.aq)) return;
      const who = idxOf(pr.pid); if(who < 0) return;
      pr.aq.forEach(a => {
        if(!a || typeof a.n !== 'number' || a.n <= (seenActs[pr.pid] || 0)) return;
        seenActs[pr.pid] = a.n;
        if(apply(a, who)) changed = true;
      });
    });
    if(changed) commit(); else if(avChanged) render();
    return;
  }
  // invitado: la pantalla sigue al estado que publica el anfitrión
  const hp = peers.find(p => p.presence && p.presence.role === 'host' && p.presence.code === code && p.presence.st);
  if(hp){
    $('#offline').hidden = true;
    const ns = hp.presence.st;
    if(!st || ns.n !== st.n){ st = ns; preload(st.dk); render(); } else if(avChanged) render();
  } else if(st){
    $('#offline').textContent = t('hostGone'); $('#offline').hidden = false;
  }
}
function commit(){
  st.n = (st.n || 0) + 1;

  if(st.p3.loc) return renderP3Local(E);
  const P = st.p3, me = myIdx(), rider = can(P.rid.includes(me)), multi = !LOCAL() && P.rid.length > 1;
  setPhase(t('stage3', {n: Math.min(P.pos+1, 9)}));
  const landing = typeof E.land === 'number';
  const slot = i => {
    const c = P.sl[i], up = !!P.rv[i];
    return slotHTML(P, i, {up, flip: up && !landing && E.flip === c, cls: landing && E.land === i ? 'land' : ''});
  };
  const cur = P.sl[Math.min(P.pos, 8)], L2 = P.last;
  let mid;
  if(P.s === 'g'){
    const cnt = {mayor:0, menor:0}; Object.values(P.vo).forEach(v => { if(cnt[v] !== undefined) cnt[v]++; });
    const myv = me >= 0 ? P.vo[st.pl[me].id] : null;
    const b = (v,l) => `<button class="choice" data-act="vote" data-v="${v}" aria-pressed="${myv === v}">${l}${multi && cnt[v] ? `<span class="vc">${cnt[v]}</span>` : ''}</button>`;
    mid = `<div class="ask">${multi ? t('vote') : LOCAL() ? t('decideAll') : rider ? t('yourTurnP') : t('decide')}<b>${t('hlThan', {c: shortArt(cur)})}</b></div>` +
      (rider ? `<div class="choices">${b('mayor', t('higher'))}${b('menor', t('lower'))}</div>` : (multi ? `<p class="wait">${t('higher')} ${cnt.mayor} · ${t('lower')} ${cnt.menor}</p>` : ''));
  } else if(P.s === 'w'){
    mid = `<div class="stamp win">${t('endTrip')}</div><p class="explain">${t('getOff', {f: failsN(P.fails)})}</p>`;
  } else {
    mid = L2.ok ? `<div class="stamp good">${t('pass')}</div><p class="explain">${withArt(L2.c)}.${L2.at === 4 ? ' ' + t('cpOn') : ''}</p>`
      : `<div class="stamp bad">${sips(L2.n)}</div><p class="explain">${withArt(L2.c)}${val(L2.c) === val(L2.t) ? ' ' + t('tieFail') : ''}. ${P.cp ? t('toCp') : t('toStart')}</p>`;
  }
  const drawn = L2 ? cardHTML(L2.c, {flip: landing && E.flip === L2.c}) : '<div class="placeholder"></div>';
  const names = P.rid.map(i => esc(st.pl[i].n)).join(', ');
  main.innerHTML = `<section class="scr p3"><p class="riders">${t('onBus')} <b>${names}</b>${!rider ? ' · ' + t('watching') : ''}</p>
    <div class="bus"><div class="bridge">${slot(4)}</div><div class="col l">${[3,2,1,0].map(slot).join('')}</div>
      <div class="mid"><div class="pile"><div class="deckstack">${cardHTML(null,{up:false})}<span class="cnt">${P.dc}</span></div>${drawn}</div>${mid}</div>
      <div class="col r">${[5,6,7,8].map(slot).join('')}</div></div></section>`;
  if(P.s === 'g'){
    if(multi){ const m = majority(P);
      if(!rider) setNext(t('voting'), false);
      else if(m) setNext(t('confirm', {v: m === 'mayor' ? t('higher') : t('lower')}), true, () => act({t:'next'}));
      else setNext(t('noMajority'), false);
    } else setNext(rider ? t('chooseHL') : t('decideName', {n: st.pl[P.rid[0]].n}), false);
  } else if(can(rider || amHost())) setNext(P.s === 'w' ? t('seeSips') : t('keepGoing'), true, () => act({t:'next'}));
  else setNext(t('waiting'), false);
}

/* ---------- Final ---------- */
function renderEnd(){
  setPhase(t('phEnd'));
  const order = st.pl.map((p,i) => i).sort((a,b) => st.pl[b].d - st.pl[a].d);
  const rid = st.p3 ? st.p3.rid : [];
  main.innerHTML = `<section class="scr end"><div class="ticket notch bigcode"><small>${t('tally')}</small><b style="letter-spacing:2px;font-size:clamp(26px,8cqw,36px)">${t('sipsTitle')}</b></div>
    <div class="rank">${order.map((i,k) => `<div class="ticket rrow ${rid.includes(i) ? 'rider' : ''}"><div class="stub">${k+1}</div>${avOfPlayer(i)}<span class="nm">${esc(st.pl[i].n)}</span><span class="dr">${st.pl[i].d}</span></div>`).join('')}</div>
    <p class="hint">${t('yellowNote')}</p></section>`;
  setExtra(`<button class="secondary" data-act="exit">${t('exitMenu')}</button>`);
  if(amHost()) setNext(t('playAgain'), true, () => act({t:'next'}));
  else setNext(t('waitAnother'), false);
}

/* ================= Eventos ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a === 'p1') act({t:'p1', v:b.dataset.v});
  else if(a === 'vote') act({t:'vote', v:b.dataset.v});
  else if(a === 'throw') throwCard(+b.dataset.p, +b.dataset.c, b);
  else if(a === 'target') act({t:'target', to:+b.dataset.t});
  else if(a === 'undo') act({t:'undo'});
  else if(a === 'reveal') act({t:'reveal', i:+b.dataset.i});
  else if(a === 'cont') act({t:'next'});
  else if(a === 'lobbydeck') act({t:'deck', v:b.dataset.v});
  else if(a === 'lobbyav') openAvatarPicker();
  else if(a === 'lang') setLang(b.dataset.v);
  else if(a === 'setav') setMyAvatar(b.dataset.v);
  else if(a === 'pickav'){ ui.draftAv = b.dataset.v; ui.avMenu = false; if($('#pfn')) ui.draftName = $('#pfn').value; const g = $('.avgrid'), sc = g ? g.scrollTop : 0; render(); const g2 = $('.avgrid'); if(g2) g2.scrollTop = sc; }
  else if(a === 'avmenu'){ ui.avMenu = !ui.avMenu; if($('#pfn')) ui.draftName = $('#pfn').value; const m = $('.avmenu'); if(m) m.hidden = !ui.avMenu; b.setAttribute('aria-expanded', ui.avMenu); }
  else if(a === 'go'){ ui.screen = b.dataset.v; if(['create','join'].includes(ui.screen) && !cleanName(ui.name)) ui.name = profile.name; if(ui.screen === 'profile'){ ui.draftAv = null; ui.draftName = undefined; } render(); }
  else if(a === 'resume') resumeSession();
  else if(a === 'exit') leaveGame();
  else if(a === 'deck'){ ui.deck = b.dataset.v; store.set('deck', ui.deck); preload(ui.deck); if(ui.names.length > MAXP(ui.deck)) ui.names.length = MAXP(ui.deck); render(); }
  else if(a === 'addP'){ ui.names.push(''); store.set('names', ui.names); render(); const el = document.getElementById('ln-' + (ui.names.length-1)); if(el) el.focus(); }
  else if(a === 'rmP'){ ui.names.splice(+b.dataset.i, 1); store.set('names', ui.names); render(); }
});
main.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'nm') ui.name = t.value;
  else if(t.id === 'pfn') ui.draftName = t.value;
  else if(t.id === 'jc'){ t.value = t.value.replace(/\D/g, '').slice(0, 4); ui.joinCode = t.value; }
  else if(t.dataset.i !== undefined){ ui.names[+t.dataset.i] = t.value; store.set('names', ui.names); }
});
main.addEventListener('change', e => { if(e.target.id === 'adult') ui.draftAdult = e.target.checked; });
main.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const t = e.target;
  if(t.dataset.i !== undefined){ const n = document.getElementById('ln-' + (+t.dataset.i + 1)); if(n) n.focus(); else t.blur(); }
  else if(t.id === 'nm' && $('#jc')) $('#jc').focus();
  else if(nextFn){ t.blur(); nextFn(); }
});

/* Menú de 3 rayas */
const drawer = $('#drawer'), scrim = $('#scrim'), burger = $('#burger');
function syncMenu(){
  $('#optMusic').setAttribute('aria-pressed', A.musicOn);
  $('#optSfx').setAttribute('aria-pressed', A.sfxOn);
  $('#optHints').setAttribute('aria-pressed', ui.hints);
  $('#optExit').hidden = !st && ui.screen === 'home';
}
function openMenu(o){ drawer.hidden = !o; scrim.hidden = !o; burger.setAttribute('aria-expanded', o); if(o) syncMenu(); }
burger.addEventListener('click', () => openMenu(drawer.hidden));
scrim.addEventListener('click', () => openMenu(false));
$('#optMusic').addEventListener('click', () => { if(!A.ac) musicStart(); setMusic(!A.musicOn, mode === 'guest' ? 'music.guest' : 'music'); });
$('#optSfx').addEventListener('click', () => { audioInit(); setSfx(!A.sfxOn); });
$('#optHints').addEventListener('click', () => { ui.hints = !ui.hints; store.set('hints', ui.hints); syncMenu(); if(st && st.ph === 'p2') render(); });
$('#optRules').addEventListener('click', () => { openMenu(false); showRules(); });
$('#optLang').addEventListener('click', () => { openMenu(false); showLangs(); });
$('#optExit').addEventListener('click', () => {
  openMenu(false);
  if(!st && !R){ ui.screen = 'home'; render(); return; }
  openModal(`<h3>${t('exitQ')}</h3><p>${mode === 'host' ? t('exitHost') : t('exitGuest')}</p>`,
    `<div class="mact"><button data-m="close">${t('keepPlaying')}</button><button class="warn" data-m="exit">${t('exit')}</button></div>`);
});
function showRules(){
  const dk = st ? st.dk : ui.deck;
  openModal(`<h3>${t('howTo')}</h3><p>${dk === 'poker' ? t('valPoker') : t('valEs')}</p>` + [1,2,3].map(k => `<h4>${t('r' + k + 't')}</h4><ul>${t('r' + k).map(l => `<li>${l}</li>`).join('')}</ul>`).join(''),
    `<div class="mact"><button data-m="close">${t('gotIt')}</button></div>`);
}
function showLangs(){
  openModal(`<h3>${t('language')}</h3><div class="langlist">${LANGS.map(l => `<button class="langbtn" data-act="lang" data-v="${l}" aria-pressed="${l === LANG}" lang="${l}">${I18N[l].langName}</button>`).join('')}</div>`,
    `<div class="mact"><button data-m="close">${t('close')}</button></div>`);
}
function setLang(l){
  if(!I18N[l]) return; LANG = l; store.set('lang', l);
  modal.hidden = true; applyStatic(); render();
}
function applyStatic(){
  document.documentElement.lang = LANG;
  $('#burger').setAttribute('aria-label', t('openMenu'));
  $('#drawer').setAttribute('aria-label', t('options'));
  $('#tOptions').textContent = t('options'); $('#tMusic').textContent = t('music'); $('#tSfx').textContent = t('sfx');
  $('#tHints').textContent = t('hints'); $('#tLang').textContent = t('language'); $('#tLangCur').textContent = I18N[LANG].langName + ' ›';
  $('#tRules').textContent = t('rules'); $('#tExit').textContent = t('exitMenu');
}
const modal = $('#modal');
function openModal(html, acts){ $('#modalBox').innerHTML = html + acts; modal.hidden = false; }
modal.addEventListener('click', e => {
  const m = e.target.closest('[data-m]');
  if(m && m.dataset.m === 'saveName') return saveFirstName();
  if((e.target === modal && !modal.dataset.lock) || (m && m.dataset.m === 'close')) modal.hidden = true;
  else if(m && m.dataset.m === 'exit'){ modal.hidden = true; leaveGame(); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ openMenu(false); if(!modal.dataset.lock) modal.hidden = true; }
  if(e.key === 'Enter' && e.target.id === 'firstName') saveFirstName();
});

preload(ui.deck);
applyStatic();
render();
getRoom();
})();
</script>
